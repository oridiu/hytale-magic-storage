# Plugin version (semantic versioning). Bumped by release-please, do not edit
# by hand.
# x-release-please-start-version
version=0.1.0
# x-release-please-end

maven_group=io.github.oridiu

# Hytale plugins are built for and run on Java 25.
java_version=25

# The plugin ships its own assets (chest, bag, recipes, translations).
includes_pack=true

# Launcher release channel the game is installed from (release or pre-release).
patchline=release

# Only used when no local HytaleServer.jar is found (e.g. on CI).
hytale_build=0.7.4

# Also load mods from <hytale_home>\UserData\Mods in the dev server.
load_user_mods=false

# Uncomment if Hytale is installed somewhere else. This is the folder that
# contains "install" and "UserData".
# hytale_home=C:/Users/you/AppData/Roaming/Hytale
