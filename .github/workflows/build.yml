name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      curseforge_check:
        description: 'Only test the CurseForge connection (lists game versions, uploads nothing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # No local Hytale install on the runner, so the build compiles against
      # com.hypixel.hytale:Server from maven.hytale.com (hytale_build).
      - name: Build plugin jar
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MagicStorage
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The tag has to match version in gradle.properties, e.g. v0.1.0.
      - name: Check tag against version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in gradle.properties"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: MagicStorage
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true

  # Uploads the released jar to CurseForge. Needs the secrets
  # CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID; skipped without them.
  # Optional repository variables: CURSEFORGE_API_URL, CURSEFORGE_GAME_VERSION,
  # CURSEFORGE_RELEASE_TYPE (alpha, beta or release; default beta).
  curseforge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      CF_API: ${{ vars.CURSEFORGE_API_URL || 'https://hytale.curseforge.com' }}
      CF_GAME_VERSION: ${{ vars.CURSEFORGE_GAME_VERSION }}
      CF_RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE || 'beta' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: MagicStorage
          path: dist

      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'CHANGELOG<<CHANGELOG_EOF'
            gh release view "$GITHUB_REF_NAME" --json body --jq .body || echo "Release $GITHUB_REF_NAME"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Upload to CurseForge
        run: .github/scripts/curseforge.sh upload "$(ls dist/*.jar | head -n 1)" "$GITHUB_REF_NAME"

  curseforge-check:
    if: github.event_name == 'workflow_dispatch' && inputs.curseforge_check
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      CF_API: ${{ vars.CURSEFORGE_API_URL || 'https://hytale.curseforge.com' }}
      CF_GAME_VERSION: ${{ vars.CURSEFORGE_GAME_VERSION }}
    steps:
      - uses: actions/checkout@v5

      - name: Test CurseForge connection
        run: .github/scripts/curseforge.sh check
