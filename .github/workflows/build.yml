name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      curseforge_check:
        description: 'Only test the CurseForge connection (lists game versions, uploads nothing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Keeps a release pull request open that bumps the version and updates
  # CHANGELOG.md from Conventional Commits. Merging that pull request creates
  # the tag and the GitHub release; the jobs below then attach the jar and
  # upload it to CurseForge.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please builds the changelog from commit messages, and pull
  # requests are squash merged, so the title must be a Conventional Commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # No local Hytale install on the runner, so the build compiles against
      # com.hypixel.hytale:Server from maven.hytale.com (hytale_build).
      - name: Build plugin jar
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MagicStorage
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5

      # release-please bumps gradle.properties in the release pull request,
      # so the tag always matches; this only guards against manual edits.
      - name: Check tag against version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match version ${version} in gradle.properties"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: MagicStorage
          path: dist

      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.jar --clobber

  # Uploads the released jar to CurseForge. Needs the secrets
  # CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID; skipped without them.
  # Optional repository variables: CURSEFORGE_API_URL, CURSEFORGE_GAME_VERSION,
  # CURSEFORGE_RELEASE_TYPE (alpha, beta or release; default beta).
  curseforge:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      CF_API: ${{ vars.CURSEFORGE_API_URL || 'https://1430699.curseforge.com' }}
      CF_GAME_VERSION: ${{ vars.CURSEFORGE_GAME_VERSION }}
      CF_RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE || 'beta' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: MagicStorage
          path: dist

      # The release notes are the new CHANGELOG.md section.
      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'CHANGELOG<<CHANGELOG_EOF'
            gh release view "$TAG" --json body --jq .body || echo "Release $TAG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Upload to CurseForge
        run: .github/scripts/curseforge.sh upload "$(ls dist/*.jar | head -n 1)" "$TAG"

  curseforge-check:
    if: github.event_name == 'workflow_dispatch' && inputs.curseforge_check
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      CF_API: ${{ vars.CURSEFORGE_API_URL || 'https://1430699.curseforge.com' }}
      CF_GAME_VERSION: ${{ vars.CURSEFORGE_GAME_VERSION }}
    steps:
      - uses: actions/checkout@v5

      - name: Test CurseForge connection
        run: .github/scripts/curseforge.sh check
