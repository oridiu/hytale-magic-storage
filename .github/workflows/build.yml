name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # No local Hytale install on the runner, so the build compiles against
      # com.hypixel.hytale:Server from maven.hytale.com (hytale_build).
      - name: Build plugin jar
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MagicStorage
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The tag has to match version in gradle.properties, e.g. v0.1.0.
      - name: Check tag against version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in gradle.properties"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: MagicStorage
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
